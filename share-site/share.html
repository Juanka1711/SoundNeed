<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07151b">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SoundNeed">
    <meta property="og:title" content="Una canción para ti · SoundNeed">
    <meta property="og:description" content="Toca la tarjeta para abrir la canción en SoundNeed.">
    <meta property="og:image" content="https://soundneed-shares.breinermuleth64.workers.dev/assets/soundneed-link-preview.png">
    <meta property="og:image:secure_url" content="https://soundneed-shares.breinermuleth64.workers.dev/assets/soundneed-link-preview.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SoundNeed: abre una canción y escúchala en la app">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Una canción para ti · SoundNeed">
    <meta name="twitter:description" content="Toca la tarjeta para abrir la canción en SoundNeed.">
    <meta name="twitter:image" content="https://soundneed-shares.breinermuleth64.workers.dev/assets/soundneed-link-preview.png">
    <title>Escucha en SoundNeed</title>
    <style>
      :root {
        color-scheme: dark; font-family: Inter, Roboto, Arial, sans-serif;
        --tone-primary: #123a42; --tone-secondary: #30234d; --tone-dark: #071015;
        --tone-accent: #58d9ca;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; padding: 28px; display: grid; place-items: center;
        color: #f5f5fb; background: radial-gradient(ellipse at 18% 8%, var(--tone-primary) 0, transparent 48%),
          radial-gradient(ellipse at 85% 90%, var(--tone-secondary) 0, transparent 44%), var(--tone-dark);
      }
      main {
        width: min(100%, 440px); padding: 26px; border: 1px solid #ffffff20;
        border-radius: 28px;
        background: linear-gradient(145deg, var(--tone-primary), var(--tone-secondary) 68%, #11151f);
        box-shadow: 0 24px 80px #0008;
      }
      .brand { display: flex; align-items: center; gap: 11px; color: #b7f5ed; font-weight: 800; letter-spacing: .04em; }
      .logo { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 14px; background: linear-gradient(145deg,#26c6b7,#7654eb); font-size: 22px; }
      h1 { margin: 26px 0 8px; font-size: clamp(24px, 7vw, 34px); line-height: 1.15; }
      p { color: #b5b6c4; line-height: 1.5; }
      .artist { margin-top: 0; }
      .track { display: flex; align-items: center; gap: 17px; margin-top: 25px; }
      .cover { flex: 0 0 94px; width: 94px; height: 94px; overflow: hidden; border-radius: 18px; background: linear-gradient(145deg,#35cabb,#59449c); box-shadow: 0 12px 34px #0005; }
      .cover img { width: 100%; height: 100%; object-fit: cover; }
      .track-copy { min-width: 0; }
      .eyebrow { margin: 0 0 5px; color: var(--tone-accent); font-size: 10px; font-weight: 800; letter-spacing: .13em; }
      .track h1 { margin: 0 0 4px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; font-size: clamp(20px, 6vw, 27px); line-height: 1.14; }
      .track .artist { margin: 0; font-size: 14px; }
      a { display: flex; justify-content: center; align-items: center; min-height: 54px; margin-top: 14px; border-radius: 18px; font-weight: 750; text-decoration: none; }
      .primary { color: #071015; background: #f5f5fb; }
      .secondary { color: #f5f5fb; border: 1px solid #ffffff24; background: #ffffff0a; }
      .note { margin: 20px 0 0; font-size: 13px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="logo">♫</span><span>SOUNDNEED</span></div>
      <div class="track">
        <div class="cover"><img id="cover" src="assets/soundneed-link-preview.png" alt="Portada de la canción"></div>
        <div class="track-copy">
          <p class="eyebrow">CANCIÓN COMPARTIDA</p>
          <h1 id="title">Canción compartida</h1>
          <p class="artist" id="artist">Abriendo SoundNeed…</p>
        </div>
      </div>
      <a class="primary" id="open" href="#">Abrir en SoundNeed</a>
      <p class="note" id="note">Si no se abre automáticamente, toca “Abrir en SoundNeed”.</p>
    </main>
    <script>
      (async () => {
        const params = new URLSearchParams(window.location.search);
        const playlistEncoded = params.get('p') || '';
        const hasPlaylistPayload = playlistEncoded.length > 0;
        let sharedPlaylist = null;
        if (playlistEncoded && 'DecompressionStream' in window) {
          try {
            const base64 = playlistEncoded.replace(/-/g, '+').replace(/_/g, '/');
            const binary = atob(base64.padEnd(Math.ceil(base64.length / 4) * 4, '='));
            const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
            sharedPlaylist = JSON.parse(await new Response(stream).text());
            if (sharedPlaylist.v !== 1 || !Array.isArray(sharedPlaylist.s)) sharedPlaylist = null;
          } catch (_) {
            sharedPlaylist = null;
          }
        }
        const firstTrack = sharedPlaylist?.s?.find(track => Array.isArray(track) && track.length > 1);
        const videoId = params.get('i') || params.get('videoId') || firstTrack?.[0] || '';
        const title = sharedPlaylist?.n ||
          (hasPlaylistPayload ? 'Playlist compartida' : (params.get('title') || 'Canción compartida'));
        const artist = sharedPlaylist
          ? `${sharedPlaylist.s.length} canciones para escuchar en SoundNeed`
          : (hasPlaylistPayload ? 'Toca para guardarla en SoundNeed' : (params.get('artist') || 'SoundNeed'));
        const manual = params.get('manual') === '1';
        document.title = `${title} · SoundNeed`;
        document.getElementById('title').textContent = title;
        document.getElementById('artist').textContent = artist;
        const cover = document.getElementById('cover');
        const applyPalette = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 24;
            const context = canvas.getContext('2d', { willReadFrequently: true });
            context.drawImage(cover, 0, 0, 24, 24);
            const pixels = context.getImageData(0, 0, 24, 24).data;
            const buckets = new Map();
            for (let offset = 0; offset < pixels.length; offset += 16) {
              const r = pixels[offset], g = pixels[offset + 1], b = pixels[offset + 2];
              const max = Math.max(r, g, b), min = Math.min(r, g, b);
              const delta = max - min;
              if (max < 28) continue;
              let hue = 0;
              if (delta) {
                if (max === r) hue = 60 * (((g - b) / delta) % 6);
                else if (max === g) hue = 60 * ((b - r) / delta + 2);
                else hue = 60 * ((r - g) / delta + 4);
              }
              hue = (hue + 360) % 360;
              const key = Math.floor(hue / 30);
              const item = buckets.get(key) || { count: 0, r: 0, g: 0, b: 0 };
              item.count++; item.r += r; item.g += g; item.b += b;
              buckets.set(key, item);
            }
            const ranked = [...buckets.entries()].sort((a, b) => b[1].count - a[1].count);
            if (!ranked.length) return;
            const toDark = (item, factor) => {
              const count = item.count;
              return `rgb(${Math.round(item.r / count * factor)}, ${Math.round(item.g / count * factor)}, ${Math.round(item.b / count * factor)})`;
            };
            const primary = ranked[0][1];
            const secondary = ranked.find(([key]) => Math.abs(key - ranked[0][0]) >= 2)?.[1] || ranked[1]?.[1] || primary;
            document.documentElement.style.setProperty('--tone-primary', toDark(primary, .32));
            document.documentElement.style.setProperty('--tone-secondary', toDark(secondary, .25));
            document.documentElement.style.setProperty('--tone-dark', toDark(primary, .09));
            const count = primary.count;
            document.documentElement.style.setProperty('--tone-accent', `rgb(${Math.round(primary.r / count * .55 + 255 * .45)}, ${Math.round(primary.g / count * .55 + 255 * .45)}, ${Math.round(primary.b / count * .55 + 255 * .45)})`);
          } catch (_) {
            // Keep the SoundNeed palette if the remote cover disallows canvas sampling.
          }
        };
        cover.crossOrigin = 'anonymous';
        cover.addEventListener('load', applyPalette, { once: true });
        if (/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
          cover.src = `https://i.ytimg.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg`;
        } else {
          cover.addEventListener('load', applyPalette, { once: true });
        }

        const deepLink = hasPlaylistPayload
          ? `soundneed://playlist?p=${encodeURIComponent(playlistEncoded)}`
          : new URL(videoId
            ? `soundneed://track/${encodeURIComponent(videoId)}`
            : 'soundneed://track');
        if (!hasPlaylistPayload) {
          if (title) deepLink.searchParams.set('title', title);
          if (artist) deepLink.searchParams.set('artist', artist);
        }

        const fallback = new URL(window.location.href);
        fallback.searchParams.set('manual', '1');
        const intentTarget = hasPlaylistPayload
          ? `playlist?p=${encodeURIComponent(playlistEncoded)}`
          : `track${deepLink.pathname.replace('/track', '')}${deepLink.search}`;
        const intentUrl = `intent://${intentTarget}` +
          `#Intent;scheme=soundneed;package=com.example.music_player;` +
          `S.browser_fallback_url=${encodeURIComponent(fallback.toString())};end`;
        document.getElementById('open').href = intentUrl;

        if (!manual) {
          window.setTimeout(() => {
            document.getElementById('artist').textContent = artist;
          }, 1100);
          window.location.replace(intentUrl);
        }
      })();
    </script>
  </body>
</html>
