<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071510">
    <meta property="og:site_name" content="SoundNeed">
    <meta property="og:title" content="Compartí desde SoundNeed">
    <meta property="og:description" content="Abre una canción compartida y escúchala en SoundNeed.">

    <title>Compartí desde SoundNeed</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,Roboto,"Segoe UI",Arial,sans-serif;background:#06110e;color:#f5f8f6}
      *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 12% 0,#12382b 0,transparent 48%),radial-gradient(ellipse at 100% 100%,#10241d 0,transparent 48%),#06110e}
      main{width:min(100%,440px);padding:24px;border:1px solid #c5efda20;border-radius:24px;background:linear-gradient(145deg,#0d241b,#091710 68%,#07120f);box-shadow:0 28px 90px #0008,0 8px 32px #36ce8120;text-align:center}

    </style>
  </head>
  <body>
    <main>
      <img src="/assets/soundneed-link-preview.png" alt="SoundNeed">
      <h1>Compartí desde SoundNeed</h1>
